# hausbuch from the :stable tag. A watchtower running on the host with label-enable installs each release promoted to
# :stable. Adapt the ports, the volume and the time zone to the installation; the app's other settings are in the README.
services:
  hausbuch:
    image: ghcr.io/davidepedone/hausbuch:stable
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      dev.dozzle.name: hausbuch
      # the app's logo (internal/web/static/favicon.svg): Dozzle takes custom icons only as a data URI
      dev.dozzle.icon: "data:image/svg+xml;base64,"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Europe/Rome
    volumes:
      - hausbuch-data:/data
    ports:
      - "8080:8080"

volumes:
  hausbuch-data:
