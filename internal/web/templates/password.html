{{define "content"}}
<div class="mx-auto max-w-sm">
  <h1 class="mb-4 text-xl font-display font-semibold">Change password</h1>
  {{with .Data.Error}}
  <p class="mb-4 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-800" role="alert">{{.}}</p>
  {{end}}
  {{if .Data.Changed}}
  <p class="mb-4 rounded border border-green-300 bg-green-50 p-3 text-sm text-green-800" role="status">Password changed.</p>
  {{end}}
  <form method="post" action="/account/password" class="space-y-4">
    <label class="block">
      <span class="mb-1 block text-sm font-medium">Current password</span>
      <input type="password" name="current" autocomplete="current-password" required
             class="w-full rounded border border-stone-300 px-3 py-2 text-base">
    </label>
    <label class="block">
      <span class="mb-1 block text-sm font-medium">New password</span>
      <input type="password" name="new" autocomplete="new-password" required
             class="w-full rounded border border-stone-300 px-3 py-2 text-base">
    </label>
    <label class="block">
      <span class="mb-1 block text-sm font-medium">Repeat new password</span>
      <input type="password" name="repeat" autocomplete="new-password" required
             class="w-full rounded border border-stone-300 px-3 py-2 text-base">
    </label>
    <button class="w-full rounded bg-sage-700 px-3 py-2 font-medium text-white hover:bg-sage-800">Change password</button>
  </form>
</div>
{{end}}
