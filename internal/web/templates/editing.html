{{define "content"}}
{{with .Data}}
<h1 class="mb-4 break-words text-xl font-display font-semibold">{{.Page.Title}}</h1>
<div class="rounded border border-amber-300 bg-amber-50 p-4" role="alert">
  {{range .Editors}}
  <p>{{.Name}} has been editing this page for {{.For}}.</p>
  {{end}}
  <p class="mt-2 text-sm text-stone-600">If you edit it too, whoever saves second will be asked to review the other change first.</p>
  <div class="mt-4 flex flex-wrap gap-2">
    <a href="{{pageURL .Page.ID}}" class="rounded bg-sage-700 px-4 py-2 font-medium text-white hover:bg-sage-800">Go back</a>
    <a href="{{pageURL .Page.ID}}/edit?anyway=1" class="rounded border border-stone-300 bg-white px-4 py-2 hover:bg-stone-100">Edit anyway</a>
  </div>
</div>
{{end}}
{{end}}
