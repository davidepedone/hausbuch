{{define "content"}}
{{with .Data}}
<p class="mb-1 text-sm"><a href="/shopping" class="text-sage-700 underline hover:text-sage-800">Shopping list</a></p>
<h1 class="mb-1 break-words font-display text-xl font-semibold">Put away {{.Entry.Name}}</h1>
<p class="mb-4 text-sm text-stone-500">Into {{.Entry.Section.Label}}</p>
<form method="post" action="/shopping/entries/{{.Entry.ID}}/put-away" class="space-y-4">
  {{with .Form.Error}}
  <p class="rounded border border-red-300 bg-red-50 p-3 text-sm text-red-800" role="alert">{{.}}</p>
  {{end}}
  <label class="block">
    <span class="mb-1 block text-sm font-medium">Name</span>
    <input name="name" value="{{.Form.Name}}" required class="w-full rounded border border-stone-300 px-3 py-2 text-base">
  </label>
  <div class="grid grid-cols-2 gap-4">
    <label class="block">
      <span class="mb-1 block text-sm font-medium">Quantity</span>
      <input name="quantity" value="{{.Form.Quantity}}" required inputmode="decimal"
             class="w-full rounded border border-stone-300 px-3 py-2 text-base">
    </label>
    <label class="block">
      <span class="mb-1 block text-sm font-medium">Unit <span class="font-normal text-stone-500">(optional)</span></span>
      <input name="unit" value="{{.Form.Unit}}" class="w-full rounded border border-stone-300 px-3 py-2 text-base">
    </label>
  </div>
  {{template "productFields" .}}
  <datalist id="categories">{{range .Categories}}<option value="{{.}}">{{end}}</datalist>
  <datalist id="locations">{{range .Locations}}<option value="{{.}}">{{end}}</datalist>
  {{template "expiryField" .Form}}
  <div class="flex flex-wrap gap-2">
    <button class="rounded bg-sage-700 px-4 py-2 font-medium text-white hover:bg-sage-800">Put away</button>
    <a href="/shopping" class="rounded px-4 py-2 text-stone-600 hover:bg-stone-100">Cancel</a>
  </div>
</form>
{{end}}
<script src="/static/suggestions.js" defer></script>
{{end}}
