{{define "content"}}
<div class="mx-auto max-w-sm">
  <h1 class="mb-4 text-xl font-display font-semibold">Sign-in link</h1>
  {{with .Data}}
  {{if .User.ID}}
  <p class="mb-4">This link signs you in as <strong>{{.User.DisplayName}}</strong>, once.</p>
  <form method="post" action="/link/{{.Token}}">
    <button class="w-full rounded bg-sage-700 px-3 py-2 font-medium text-white hover:bg-sage-800">Sign in as {{.User.DisplayName}}</button>
  </form>
  {{else}}
  <p class="mb-4">This link is no longer valid: links last {{linkMinutes}} minutes and sign in once. Ask for a new one.</p>
  <a href="/login" class="text-sage-700 underline hover:text-sage-800">Sign in</a>
  {{end}}
  {{end}}
</div>
{{end}}
