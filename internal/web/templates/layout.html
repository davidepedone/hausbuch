{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hausbuch</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-3xl items-center gap-4 px-4 py-3">
      <a href="/" class="shrink-0 text-lg font-semibold">hausbuch</a>
      {{with .User}}
      <nav class="ml-auto flex min-w-0 items-center gap-3 text-sm">
        <a href="/account/password" class="truncate text-stone-600 hover:text-stone-900">{{.DisplayName}}</a>
        <form method="post" action="/logout">
          <button class="whitespace-nowrap rounded px-2 py-1 text-stone-600 hover:bg-stone-100 hover:text-stone-900">Sign out</button>
        </form>
      </nav>
      {{end}}
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-4 py-6">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
