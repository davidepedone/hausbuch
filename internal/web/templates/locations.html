{{define "content"}}
<h1 class="mb-4 font-display text-xl font-semibold">Locations</h1>
{{with .Data}}
<ul class="divide-y divide-stone-200 rounded border border-stone-200 bg-white">
  {{range .}}
  <li>
    <a href="{{locationURL .Name}}" class="flex items-baseline justify-between gap-3 px-4 py-3 hover:bg-stone-50">
      <span class="min-w-0 break-words font-medium">{{.Name}}</span>
      <span class="shrink-0 text-sm text-stone-500">{{.Rows}} {{if eq .Rows 1}}item{{else}}items{{end}}</span>
    </a>
  </li>
  {{end}}
</ul>
{{else}}
<p class="text-stone-500">No item has a location yet.</p>
{{end}}
{{end}}
